<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Temperature Reading Details</title>

<link rel="stylesheet" href="css/style.css">


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI",Arial,sans-serif;
}


body{

    background:#eef5fb;

}


/* Navbar */

nav{

    background:linear-gradient(90deg,#1565c0,#42a5f5);

    color:white;

    padding:20px 40px;

    display:flex;

    justify-content:space-between;

    align-items:center;

    box-shadow:0 5px 15px rgba(0,0,0,0.2);

}


nav h2{

    font-size:26px;

}


nav ul{

    display:flex;

    gap:25px;

    list-style:none;

}


nav a{

    color:white;

    text-decoration:none;

    font-weight:bold;

}


nav a:hover{

    text-decoration:underline;

}



/* Main Container */

.details{

    width:90%;

    max-width:800px;

    margin:50px auto;

    text-align:center;

}



.details > h2{

    color:#1565c0;

    font-size:32px;

    margin-bottom:30px;

}



/* Details Card */

.detail-card{

    background:white;

    padding:35px;

    border-radius:20px;

    box-shadow:0 10px 25px rgba(0,0,0,0.15);

    animation:fade 0.5s ease;

}



@keyframes fade{

    from{

        opacity:0;

        transform:translateY(20px);

    }

    to{

        opacity:1;

        transform:translateY(0);

    }

}



.detail-card h2{

    color:#1565c0;

    margin-bottom:25px;

    font-size:28px;

}



.detail-card p{

    background:#f4f9ff;

    margin:15px 0;

    padding:15px;

    border-radius:12px;

    font-size:18px;

    font-weight:600;

}



/* Status */

.status-safe{

    color:green;

}


.status-danger{

    color:red;

}



/* Button */

.btn{

    display:inline-block;

    margin-top:30px;

    padding:12px 25px;

    background:#1565c0;

    color:white;

    border-radius:30px;

    text-decoration:none;

    font-weight:bold;

    transition:0.3s;

}


.btn:hover{

    background:#0d47a1;

    transform:scale(1.05);

}



/* Footer */

footer{

    text-align:center;

    margin-top:50px;

    color:#555;

}


</style>

</head>


<body>


<nav>

<h2>🧊 Vaccine Cold Chain</h2>


<ul>

<li>
<a href="index.html">Home</a>
</li>


<li>
<a href="dashboard.html">Dashboard</a>
</li>


</ul>

</nav>




<div class="details">


<h2>🌡 Temperature Reading Details</h2>



<div id="detailsBox">

<p>Loading...</p>

</div>



<a href="dashboard.html" class="btn">

⬅ Back to Dashboard

</a>



</div>




<footer>

<p>
© 2026 Vaccine Cold Chain Monitoring System
</p>

</footer>




<script src="js/details.js"></script>


</body>

</html>
